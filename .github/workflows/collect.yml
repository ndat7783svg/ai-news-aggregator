name: Thu thập & tóm tắt tin

on:
  schedule:
    # Mỗi 30 phút, nhưng ở phút LẺ (:13 và :43) thay vì :00/:30.
    # Phút tròn là giờ cao điểm của GitHub -> scheduled workflow hay bị bỏ qua.
    # Phút lẻ/thấp điểm giúp lịch chạy đều đặn hơn nhiều.
    - cron: "13,43 * * * *"
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions

# Không cho 2 lần chạy chồng lên nhau.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài dependencies
        run: npm ci

      - name: Chạy pipeline (thu thập → tóm tắt → ghi Supabase)
        run: node pipeline.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Token GitHub tự cấp sẵn cho mỗi lần chạy (giúp phần GitHub collector chạy mượt).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tuỳ chọn — có thì hút thêm Reddit, không có thì bỏ qua:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
